<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Impacgo HRMS — workforce management system.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Impacgo HRMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Impacgo HRMS</title>
  <link rel="manifest" href="manifest.json">
  <!--
    PERF-13: lightweight HTML/CSS splash shown immediately while
    main.dart.js / CanvasKit (~12 MB) download, instead of a blank page.
    Removed as soon as Flutter renders its first frame.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #f5f7fb; }
    #app-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1b2440; background: #f5f7fb; z-index: 9999;
      transition: opacity .25s ease;
    }
    #app-splash img { width: 56px; height: 56px; border-radius: 16px; }
    #app-splash .title { font-size: 20px; font-weight: 700; }
    #app-splash .bar {
      width: 200px; height: 4px; border-radius: 4px; background: #e2e7f2; overflow: hidden;
    }
    #app-splash .bar > div {
      width: 40%; height: 100%; border-radius: 4px; background: #2f5bea;
      animation: splash-slide 1.2s ease-in-out infinite;
    }
    #app-splash .hint { font-size: 12.5px; color: #6b7593; }
    @keyframes splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      html, body, #app-splash { background: #0f1422; color: #e6e9f2; }
      #app-splash .bar { background: #26304a; }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="progressbar" aria-label="Loading Impacgo HRMS">
    <img src="icons/Icon-192.png" alt="">
    <div class="title">Impacgo HRMS</div>
    <div class="bar"><div></div></div>
    <div class="hint" id="app-splash-hint">Loading…</div>
  </div>
  <script>
    (function () {
      function hideSplash() {
        var el = document.getElementById('app-splash');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
      }
      // Fired by the Flutter engine when the first frame has been rendered.
      window.addEventListener('flutter-first-frame', hideSplash, { once: true });
      setTimeout(function () {
        var hint = document.getElementById('app-splash-hint');
        if (hint) hint.textContent = 'Still loading — slow connection detected…';
      }, 8000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
